<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
    (function () {
        var key = "theme_manual_override";
        var theme = null;
        try {
            var saved = window.localStorage.getItem(key);
            if (saved === "light" || saved === "dark") theme = saved;
        } catch (_) {}
        if (!theme) {
            var hour = new Date().getHours();
            theme = (hour >= 19 || hour < 7) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
    })();
</script>
<link rel="icon" type="image/svg+xml" href="./things/puzzle.svg">
<title>Puzzle苦力小工具</title>
<link rel="stylesheet" href="theme/light-theme.css">
<link rel="stylesheet" href="theme/dark-theme.css">
<link rel="stylesheet" href="theme/common-styles.css">
<link rel="prefetch" href="text-tools/text-tools.html">
<link rel="prefetch" href="text-tools/text-tools.css">
<link rel="prefetch" href="text-tools/tools/bundle.js">
<link rel="prefetch" href="image-tools/image-tools.html">
<link rel="prefetch" href="image-tools/image-tools.css">
<style>
    .home-shell {
        width: min(980px, calc(100% - 26px));
        margin: 0 auto;
        padding: 30px 0 38px;
    }

    .title {
        text-align: center;
        font-size: clamp(1.9rem, 1.2rem + 1.8vw, 2.5rem);
        color: var(--title-main);
        text-shadow: 0 0 16px var(--title-glow);
        margin: 8px 0 30px;
        letter-spacing: 0.7px;
    }

    .tool-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        justify-content: start;
        gap: 16px;
    }

    .tool-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface-3);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .tool-card a {
        display: block;
        padding: 18px;
        text-decoration: none;
        color: var(--text-main);
        min-height: 150px;
    }

    .tool-card:hover {
        transform: translateY(-6px);
        border-color: var(--line-strong);
        box-shadow: 0 16px 48px 8px color-mix(in srgb, var(--primary-glow) 24%, transparent);
    }

    [data-theme="light"] .tool-card:hover {
        box-shadow: 0 8px 48px 8px rgba(0, 0, 0, 0.13);
        /* inset(上 右 下 左)：上边缘贴齐元素，其余往外扩60px，保证阴影不出现在卡片上方 */
        clip-path: inset(0 -60px -60px -60px round 12px);
    }

    .tool-card:active {
        transform: translateY(0) scale(0.985);
    }

    .tool-head {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .tool-desc {
        font-size: 0.78rem;
        color: var(--text-sub);
        line-height: 1.38;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .recommend-section {
        margin-top: 28px;
    }

    .recommend-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
    }

    .section-title {
        margin: 0;
        font-size: 1.12rem;
        color: var(--title-main);
        font-weight: 700;
    }

    .site-search {
        position: relative;
        flex: 1 1 360px;
        max-width: 440px;
    }

    .site-search::before {
        content: "⌕";
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-52%);
        color: var(--text-sub);
        font-size: 1rem;
        pointer-events: none;
    }

    .site-search-input {
        width: 100%;
        height: 42px;
        padding: 9px 14px 9px 36px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-3);
        color: var(--text-main);
        font: inherit;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .site-search-input::placeholder {
        color: color-mix(in srgb, var(--text-sub) 82%, transparent);
    }

    .site-search-input:focus {
        border-color: color-mix(in srgb, var(--primary) 78%, white 22%);
        box-shadow: var(--focus-ring);
    }

    .recommend-panel {
        max-height: clamp(260px, 34vh, 420px);
        overflow-y: auto;
        overscroll-behavior: contain;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--surface-2) 88%, transparent);
        box-shadow: var(--shadow-1);
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--primary) 46%, transparent) transparent;
    }

    .recommend-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .recommend-item {
        border-bottom: 1px solid var(--line);
    }

    .recommend-item:last-child {
        border-bottom: 0;
    }

    .recommend-link {
        display: block;
        padding: 13px 16px;
        min-height: 50px;
        overflow: hidden;
        color: var(--text-main);
        text-decoration: none;
        transition: min-height 0.22s ease, background-color 0.22s ease, color 0.22s ease;
    }

    .recommend-link:hover,
    .recommend-link:focus-visible {
        min-height: 112px;
        background: color-mix(in srgb, var(--primary-soft) 72%, transparent);
        outline: none;
    }

    .recommend-name {
        display: block;
        font-weight: 650;
        line-height: 1.3;
    }

    .recommend-detail {
        display: grid;
        gap: 6px;
        max-height: 0;
        opacity: 0;
        transform: translateY(-4px);
        transition: max-height 0.22s ease, opacity 0.18s ease, transform 0.22s ease;
    }

    .recommend-link:hover .recommend-detail,
    .recommend-link:focus-visible .recommend-detail {
        max-height: 220px;
        margin-top: 8px;
        opacity: 1;
        transform: translateY(0);
    }

    .recommend-desc,
    .recommend-url,
    .empty-sites {
        font-size: 0.82rem;
        line-height: 1.42;
        color: var(--text-sub);
    }

    .recommend-url {
        word-break: break-all;
        color: color-mix(in srgb, var(--primary) 76%, var(--text-main));
    }

    .empty-sites {
        display: none;
        padding: 14px 16px;
    }

    .empty-sites.show {
        display: block;
    }

    .release-modal {
        position: fixed;
        inset: 0;
        z-index: 2400;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.54);
    }

    .release-modal[hidden] {
        display: none;
    }

    .release-card {
        width: min(560px, 100%);
        max-height: min(680px, calc(100vh - 32px));
        overflow: auto;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: color-mix(in srgb, var(--surface-1) 96%, transparent);
        box-shadow: var(--shadow-2);
    }

    .release-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 52px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
    }

    .release-head h2 {
        margin: 0;
        font-size: 1.08rem;
    }

    .release-close {
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text-sub);
        font: inherit;
        font-size: 1.45rem;
        line-height: 1;
        cursor: pointer;
    }

    .release-close:hover {
        color: var(--danger);
        background: var(--danger-soft);
    }

    .release-body {
        display: grid;
        gap: 14px;
        padding: 14px;
        color: var(--text-main);
    }

    .release-date,
    .release-section h3,
    .release-section li {
        font-size: 0.88rem;
    }

    .release-date {
        margin: 0;
        color: var(--text-sub);
    }

    .release-section h3 {
        margin: 0 0 8px;
        color: var(--title-main);
    }

    .release-section ul {
        margin: 0;
        padding-left: 20px;
    }

    .release-section li + li {
        margin-top: 6px;
    }

    .release-actions {
        display: flex;
        justify-content: flex-end;
        padding-top: 2px;
    }

    .release-confirm {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid color-mix(in srgb, var(--primary) 42%, transparent);
        border-radius: 9px;
        background: color-mix(in srgb, var(--primary-soft) 82%, transparent);
        color: var(--text-main);
        font: inherit;
        cursor: pointer;
    }

    @media (max-width: 620px) {
        .home-shell {
            width: calc(100% - 20px);
            padding-top: 24px;
        }

        .tool-grid {
            grid-template-columns: 1fr;
        }

        .recommend-head {
            align-items: stretch;
            flex-direction: column;
            gap: 10px;
        }

        .site-search {
            flex-basis: auto;
            max-width: none;
        }
    }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题" aria-pressed="false">
    <span class="theme-toggle-slider"></span>
</button>

<div class="home-shell">
    <h1 class="title">Puzzle苦力小工具</h1>

    <div class="tool-grid">
        <div class="tool-card"><a href="text-tools/text-tools.html">
            <div class="tool-head"><span>🔠</span><span>文字工具</span></div>
            <div class="tool-desc">摩斯、栅栏、移位、自定义密码表与进制换算。</div>
        </a></div>
        <div class="tool-card"><a href="image-tools/image-tools.html">
            <div class="tool-head"><span>🖼️</span><span>图片工具</span></div>
            <div class="tool-desc">图像裁切、拼图与视觉解谜辅助。</div>
        </a></div>
        <div class="tool-card"><a href="#">
            <div class="tool-head"><span>✏️</span><span>纸笔工具</span></div>
            <div class="tool-desc">纸笔密码、表格与手工推理辅助。</div>
        </a></div>
    </div>

    <section class="recommend-section" aria-labelledby="recommendTitle">
        <div class="recommend-head">
            <h2 class="section-title" id="recommendTitle">你可能需要</h2>
            <label class="site-search">
                <span class="sr-only">搜索工具网站</span>
                <input class="site-search-input" id="siteSearch" type="search" placeholder="按名字或网址搜索" autocomplete="off">
            </label>
        </div>
        <div class="recommend-panel">
            <ul class="recommend-list" id="recommendList"></ul>
            <div class="empty-sites" id="emptySites">没有匹配的网站。</div>
        </div>
    </section>
</div>

<div class="release-modal" id="releaseModal" hidden>
    <section class="release-card" role="dialog" aria-modal="true" aria-labelledby="releaseTitle">
        <div class="release-head">
            <h2 id="releaseTitle">更新公告</h2>
            <button class="release-close" id="releaseClose" type="button" aria-label="关闭">&times;</button>
        </div>
        <div class="release-body">
            <p class="release-date" id="releaseDate"></p>
            <div class="release-section">
                <h3>这次更新</h3>
                <ul id="releaseUpdates"></ul>
            </div>
            <div class="release-section">
                <h3>如果页面没有刷新</h3>
                <ul id="releaseCacheTips"></ul>
            </div>
            <div class="release-actions">
                <button class="release-confirm" id="releaseConfirm" type="button">知道了</button>
            </div>
        </div>
    </section>
</div>

<script src="theme/theme-system.js"></script>
<script src="recommended-tools.js"></script>
<script src="release-notes.js"></script>
<script src="theme/cache-client.js" defer></script>
<script>
    initThemeManager({
        allowToggle: true,
        toggleSelector: "#themeToggle"
    });

    (function () {
        var tools = window.RECOMMENDED_TOOLS || [];
        var list = document.getElementById("recommendList");
        var search = document.getElementById("siteSearch");
        var empty = document.getElementById("emptySites");

        function normalize(value) {
            return String(value || "").toLowerCase().trim();
        }

        function getSearchText(tool) {
            return normalize([
                tool.name,
                tool.url,
                tool.description,
                (tool.aliases || []).join(" ")
            ].join(" "));
        }

        function createToolItem(tool) {
            var item = document.createElement("li");
            item.className = "recommend-item";
            item.dataset.searchText = getSearchText(tool);

            var link = document.createElement("a");
            link.className = "recommend-link";
            link.href = tool.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.setAttribute("aria-label", tool.name + "，新页面打开");

            var name = document.createElement("span");
            name.className = "recommend-name";
            name.textContent = tool.name;

            var detail = document.createElement("span");
            detail.className = "recommend-detail";

            var desc = document.createElement("span");
            desc.className = "recommend-desc";
            desc.textContent = tool.description;

            var url = document.createElement("span");
            url.className = "recommend-url";
            url.textContent = tool.url;

            detail.append(desc, url);
            link.append(name, detail);
            item.appendChild(link);

            return item;
        }

        function filterTools() {
            var keyword = normalize(search.value);
            var shown = 0;

            Array.prototype.forEach.call(list.children, function (item) {
                var matched = !keyword || item.dataset.searchText.indexOf(keyword) !== -1;
                item.hidden = !matched;
                if (matched) shown += 1;
            });

            empty.classList.toggle("show", shown === 0);
        }

        tools.forEach(function (tool) {
            list.appendChild(createToolItem(tool));
        });

        search.addEventListener("input", filterTools);
        filterTools();
    })();

    (function () {
        var notes = window.PUZZLE_RELEASE_NOTES;
        if (!notes || !notes.version) return;

        var key = "puzzle_release_seen_version";
        var seen = null;
        try {
            seen = window.localStorage.getItem(key);
        } catch (_) {}
        if (seen === notes.version) return;

        var modal = document.getElementById("releaseModal");
        var title = document.getElementById("releaseTitle");
        var date = document.getElementById("releaseDate");
        var updates = document.getElementById("releaseUpdates");
        var cacheTips = document.getElementById("releaseCacheTips");
        var close = document.getElementById("releaseClose");
        var confirm = document.getElementById("releaseConfirm");
        if (!modal || !title || !date || !updates || !cacheTips) return;

        function fillList(list, items) {
            list.textContent = "";
            (items || []).forEach(function (text) {
                var item = document.createElement("li");
                item.textContent = text;
                list.appendChild(item);
            });
        }

        function dismiss() {
            modal.hidden = true;
            try {
                window.localStorage.setItem(key, notes.version);
            } catch (_) {}
        }

        title.textContent = notes.title || "更新公告";
        date.textContent = notes.date ? "更新日期：" + notes.date : "";
        fillList(updates, notes.updates);
        fillList(cacheTips, notes.cacheTips);
        modal.hidden = false;

        close.addEventListener("click", dismiss);
        confirm.addEventListener("click", dismiss);
        modal.addEventListener("click", function (event) {
            if (event.target === modal) dismiss();
        });
        document.addEventListener("keydown", function (event) {
            if (!modal.hidden && event.key === "Escape") dismiss();
        });
    })();
</script>
</body>
</html>
